$mod = SUPER

exec-once = ln -sfn ~/Devworx/Artifacts/backgrounds ~/.local/share/backgrounds && sleep 1
exec-once = ln -sfn ~/Devworx/Artifacts/fonts ~/.local/share/fonts
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
exec-once = /usr/bin/gnome-keyring-daemon --start --components=secrets
exec-once = blueman-daemon &

exec-once = systemctl --user import-environment DISPLAY WAYLAND_DISPLAY
exec-once = hash xdg-desktop-portal-hyprland 2>/dev/null && xdg-desktop-portal-hyprland || xdg-desktop-portal-gnome || xdg-desktop-portal-kde

env = XCURSOR_THEME, Adwaita
env = XCURSOR_SIZE, 24
env = HYPRCURSOR_THEME, Adwaita
env = HYPRCURSOR_SIZE, 24

exec-once = hyprctl setcursor Adwaita 24
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Adwaita'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita'
exec-once = gsettings set org.gnome.desktop.interface icon-theme 'Adwaita'

exec-once = gsettings set org.gnome.desktop.interface font-name "Monolisa Bold 11"
exec-once = gsettings set org.gnome.desktop.interface monospace-font-name "Monolisa Bold 11"
exec-once = gsettings set org.gnome.desktop.interface document-font-name "Monolisa Bold 11"

exec-once = gsettings set org.gnome.settings-daemon.plugins.xsettings antialiasing "rgba"
exec-once = gsettings set org.gnome.settings-daemon.plugins.xsettings hinting "slight"
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-light'

exec = ~/.local/bin/monitors.sh
exec-once = ~/.local/bin/hyprsync.sh

$monitor=--monitor "$(hyprctl monitors -j | jq -r '.[] | select(.focused == true).name')"

debug {
    overlay = false
}

decoration {
    rounding = 10
    active_opacity = 0.95
    inactive_opacity = 0.7
    fullscreen_opacity = 0.9

    blur {
        enabled = true
        size = 14
        passes = 3
        new_optimizations = on
        ignore_opacity = true
        xray = false
        popups = true
        noise = 0.02
        contrast = 1
        brightness = 1.05
        vibrancy = 0.12
    }

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(4c4f6918)
    }
}

animations {
    enabled = true
    bezier = bezier_1, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, bezier_1
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 4, default
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1
    col.active_border = rgba(7287fdcc)
    col.inactive_border = rgba(ccd0da66)
    layout = dwindle
    resize_on_border = true
    workspace = 1,2,3,4
}

device[2.4g-wireless-receiver] {
    kb_options = altwin:swap_lalt_lwin
}

device {
    name = syna2ba6:00-06cb:cfd3-touchpad
    enabled = false
}

device {
    name = gxtp7936:00-27c6:0123
    enabled = false
}

input {
    follow_mouse = 0
}

# Layer rules
layerrule = blur on, match:namespace kitty
layerrule = ignore_alpha 0, match:namespace kitty

layerrule = ignore_alpha 0, match:namespace waybar
layerrule = blur on, match:namespace waybar

layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0, match:namespace rofi

layerrule = blur on, match:namespace swaync-control-center
layerrule = blur on, match:namespace swaync-control-center-window
layerrule = blur on, match:namespace swaync-notification-window
layerrule = blur on, match:namespace swaync-notification-popup
layerrule = blur on, match:namespace swaync-notification

layerrule = ignore_alpha 0, match:namespace swaync-control-center
layerrule = ignore_alpha 0, match:namespace swaync-control-center-window
layerrule = ignore_alpha 0, match:namespace swaync-notification-window
layerrule = ignore_alpha 0, match:namespace swaync-notification-popup
layerrule = ignore_alpha 0, match:namespace swaync-notification

layerrule = animation layersIn, match:namespace swaync-control-center
layerrule = animation slide, match:namespace swayncosd
layerrule = animation layersIn, match:namespace rofi

# Window rules (valid)
windowrule = match:class .*, opacity 0.9
windowrule = match:focus 1, opacity 0.9
windowrule = match:title ^(hyprlock)$
windowrule = match:class ^(Rofi)$, float on

# Keybinds
bind = $mod, RETURN, exec, kitty
bind = $mod, SPACE, exec, rofi -show drun -prompt "Search"
bind = $mod, P, exec, rofi -dmenu -password -config ~/.config/rofi/password.rasi
bind = $mod, W, exec, ~/.local/bin/wallpaper-select.sh
bind = $mod, T, exec, ~/.local/bin/todo.sh
bind = $mod, Q, exec, hyprctl dispatch exit
bind = $mod, O, killactive
bind = $mod, F, fullscreen, 0
bind = $mod, M, fullscreenstate, 1 set
bind = ALT, TAB, cyclenext
bind = ALT_SHIFT, TAB, cyclenext, prev
bind = ALT, A, exec, /home/you/.local/bin/bluetooth.sh --actions

bind = SUPER, bracketleft, workspace, r-1
bind = SUPER, bracketright, workspace, r+1

bind = , XF86AudioRaiseVolume, exec, swayosd-client $monitor --output-volume 5
bind = , XF86AudioLowerVolume, exec, swayosd-client $monitor --output-volume -5
bind = , XF86AudioMute, exec, swayosd-client $monitor --output-volume mute-toggle
bind = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bind = , XF86MonBrightnessUp, exec, ~/.local/bin/brightnessctl-intel.sh up
bind = , XF86MonBrightnessDown, exec, ~/.local/bin/brightnessctl-intel.sh down
